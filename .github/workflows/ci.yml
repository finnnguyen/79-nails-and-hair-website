name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # Several pages (services/staff/reviews) are statically prerendered and
      # fetch from Supabase at build time — NEXT_PUBLIC_SUPABASE_URL/KEY must
      # be real values, not placeholders, or the build fails. Add them under
      # repo Settings -> Secrets and variables -> Actions. They're the public
      # anon key, not sensitive, but kept as secrets here for simplicity.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
